project:
  name: python-client
  description: The python client for the Organizze API SDK
toolchain:
  default: uv
language: python
layer: library
tasks:
  bump:
    script: uv version --bump patch && uv sync
    toolchain: uv
    local: true
    type: run
    options:
      cache: false
      persistent: false
      runInCI: false
  generate-client:
    script: npx @openapitools/openapi-generator-cli generate -i ../../specs/openapi.yaml -g python -o . -c ../config/python.json
    toolchain: node
    type: build
    inputs:
      - /specs/openapi.yaml
      - /clients/config/python.json
    outputs:
      - organizze_api/**
      - docs/**
      - .gitignore
      - requirements.txt
      - setup.cfg
      - test-requirements.txt
      - test/__init__.py
  clean-build:
    type: run
    script: rm -rf dist/
  build:
    command: uv build
    toolchain: uv
    type: build
    deps:
      - generate-client
      - clean-build
    inputs:
      - docs/**
      - organizze_api/**
      - test/**
      - tests/**
      - pyproject.toml
    outputs:
      - dist/**
    options:
      persistent: false
      runDepsInParallel: false
  publish:
    command: uv publish
    local: true
    deps:
      - build
    options:
      persistent: true
      runInCI: false
      envFile: .env
  test:
    command: uv run pytest
    toolchain: uv
    type: test
    inputs:
      - organizze_api/**
      - tests/**
      - test/**
      - pyproject.toml
